# release: build the installer on a version tag, smoke-test the packaged solver on CPU, publish checksums and provenance
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements-lock.txt
      - name: Rebuild PyInstaller bootloader from source
        run: |
          $version = ((Select-String requirements-lock.txt -Pattern '^pyinstaller==').Line -split '==')[1]
          git clone --depth 1 --branch "v$version" https://github.com/pyinstaller/pyinstaller.git "$env:RUNNER_TEMP\pyinstaller"
          Push-Location "$env:RUNNER_TEMP\pyinstaller\bootloader"
          python ./waf all --target-arch=64bit
          Pop-Location
          pip install --force-reinstall --no-deps "$env:RUNNER_TEMP\pyinstaller"
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements-lock.txt
      - name: Regression suite (CPU)
        run: python -m src.run.regression --backend cpu
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build app and installer
        env:
          INNO_COMPILER: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: ./packaging/build.ps1
      - name: Smoke test packaged solver (CPU)
        run: |
          $process = Start-Process dist\HomebrewCFD\HomebrewCFD.exe -ArgumentList "--solve", "cases/smoke/wing_smoke.json", "--backend", "cpu", "--runs", "smoke_runs" -Wait -PassThru
          $result = Get-ChildItem smoke_runs -Recurse -Filter result.json | Select-Object -First 1 | Get-Content -Raw | ConvertFrom-Json
          if ($result.status -ne "finished") { throw "smoke run status: $($result.status)" }
          $lift = $result.parts.wing.y.mean
          if ([double]::IsNaN($lift) -or [math]::Abs($lift - (-0.0335)) -gt 0.001) { throw "smoke run C_y $lift outside -0.0335 +/- 0.001" }
          Write-Host "smoke run finished, C_y $lift"
      - uses: actions/upload-artifact@v7
        with:
          name: HomebrewCFD-build
          path: |
            dist/HomebrewCFD/
            dist/installer/*.exe
          retention-days: 14
  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: HomebrewCFD-build
          path: dist
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign app
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: homebrewcfd
          certificate-profile-name: homebrew-cfd
          files: ${{ github.workspace }}\dist\HomebrewCFD\HomebrewCFD.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build installer around the signed app
        env:
          INNO_COMPILER: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: |
          Remove-Item dist\installer\*.exe
          ./packaging/build.ps1 -stage installer
      - name: Sign installer
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: homebrewcfd
          certificate-profile-name: homebrew-cfd
          files-folder: ${{ github.workspace }}\dist\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signatures
        run: |
          foreach ($file in @("dist\HomebrewCFD\HomebrewCFD.exe") + (Get-ChildItem dist\installer\*.exe).FullName) {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne "Valid") { throw "$file signature: $($signature.Status)" }
              Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Checksums
        run: |
          Get-ChildItem dist\installer\*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist\installer\SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/installer/*.exe
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          files: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt